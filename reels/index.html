<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Reels ระบบเทพยุทธ์เจ้าคัมภีร์</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Sarabun:wght@400;500;600&display=swap">
<style>
  /* #ABC-Paobunjin (เปาบุ้นจิ้น) — free for personal and commercial use on all media (fonts/LICENSE.txt); italic is the house style */
  @font-face { font-family: "ABC Paobunjin"; src: url("../fonts/ABC-Paobunjin.woff2") format("woff2"); font-weight: 400 700; font-style: normal; font-display: swap; }
  @font-face { font-family: "ABC Paobunjin"; src: url("../fonts/ABC-Paobunjin-BoldItalic.woff2") format("woff2"); font-weight: 400 700; font-style: italic; font-display: swap; }
</style>
<style>
  :root { --ink:#0a0c11; --panel:#11151d; --panel-2:#171c27; --text:#f1e9d3; --muted:#a59d88; --gold:#e0bb5e; --gold-line:rgba(224,187,94,.38); --gold-faint:rgba(224,187,94,.10); color-scheme: dark; }
  body { margin:0; background:var(--ink); color:var(--text); font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif; font-size:16px; line-height:1.6; }
  .wrap { max-width:680px; margin:0 auto; padding-inline:16px; }
  header { padding-block:22px 12px; display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  h1 { margin:0; font-family: "ABC Paobunjin", "Charm", "Taviraj", serif; font-style: italic; font-weight: 700; font-size:clamp(28px,8vw,38px); color:var(--gold); }
  header a { color:var(--muted); font-size:14px; text-decoration:none; white-space:nowrap; }
  header a:hover { color:var(--gold); }

  /* ---- list ---- */
  .note { font-size:13px; color:var(--muted); padding-block:18px 4px; }
  ol { list-style:none; margin:0; padding:0; display:grid; gap:8px; padding-block:8px 40px; }
  .ch { display:grid; grid-template-columns:46px 1fr; gap:4px 14px; align-items:center; padding:10px 12px 10px 8px; background:var(--panel); border:1px solid transparent; }
   .num { grid-row:1/3; display:grid; place-items:center; width:46px; height:46px; border:1px solid var(--gold-line); font-family: "ABC Paobunjin", "Charm", "Taviraj", serif; font-style: italic; font-weight: 700; font-size:24px; color:var(--gold); background:var(--gold-faint); }
  .t { font-family: "ABC Paobunjin", "Charm", "Taviraj", serif; font-style: italic; font-weight: 700; font-size:22px; line-height:1.3; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { display:inline-block; padding:5px 12px; border:1px solid var(--gold-line); color:var(--gold); background:var(--panel-2); font-family: "ABC Paobunjin", "Charm", "Taviraj", serif; font-style: italic; font-weight: 700; font-size:21px; text-decoration:none; cursor:pointer; }
  .chip:hover { background:var(--gold); color:#15120b; border-color:var(--gold); }
  footer { padding-block:0 40px; font-size:12px; color:var(--muted); text-align:center; }
  /* 8 Nov 2026 (user): search like the chapter index */
  .bar { position:sticky; top:0; z-index:5; background:var(--ink); padding-block:10px; border-bottom:1px solid var(--gold-faint); }
  .bar-inner { display:flex; gap:8px; }
  .bar input { flex:1; min-width:0; font:inherit; font-size:16px; color:var(--text); background:var(--panel); border:1px solid var(--gold-line); padding:9px 12px; outline:none; }
  .bar input:focus { border-color:var(--gold); }
  .bar button { font:inherit; font-size:14px; color:var(--gold); background:var(--panel-2); border:1px solid var(--gold-line); padding:0 12px; cursor:pointer; white-space:nowrap; }
  .empty { color:var(--muted); padding:16px 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Reels ทุกตอน</h1><a href="../">← สารบัญ</a></header>

  <p class="note" id="note">กดปุ่มตอนเพื่อเปิดรีลบน Facebook · รายการอัปเดตทุกวัน</p>
</div>
<div class="bar"><div class="wrap bar-inner">
  <input id="q" type="search" placeholder="ค้นหาเลขตอนหรือชื่อตอน…" aria-label="ค้นหารีล" autocomplete="off">
  <button id="latest" type="button">ไปท้ายรายการ</button>
</div></div>
<div class="wrap">
  <ol id="list"></ol>
  <footer>รีลตอนใหม่โพสต์ทุกวัน · ตอนที่ยังไม่มีในรายการ ดูได้ที่แท็บ Reels ของเพจ Online Novel</footer>
</div>

<script>
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  let ALL = [];
  const list = document.getElementById("list"), q = document.getElementById("q");
  function render(filter) {
    const f = (filter || "").trim().toLowerCase().replace(/^ตอนที่\s*/, "");
    const rows = ALL.filter(([n, c]) => !f || String(n) === f || String(n).startsWith(f) && /^\d+$/.test(f) || c.title.toLowerCase().includes(f));
    if (!rows.length) { list.innerHTML = '<li class="empty">ไม่พบรีลที่ค้นหา</li>'; return; }
    let html = "";
    for (const [n, c] of rows) {
      const chips = c.parts.map(r => `<a class="chip" href="${esc(r.url)}" target="_blank" rel="noopener">▶ ${r.parts === 1 ? "ตอนที่ " + n : r.part + "/" + r.parts}</a>`).join("");
      html += `<li class="ch" id="c${n}"><span class="num">${n}</span><span class="t">${esc(c.title)}</span><span class="chips">${chips}</span></li>`;
    }
    list.innerHTML = html;
  }
  q.addEventListener("input", () => render(q.value));
  document.getElementById("latest").addEventListener("click", () => {
    q.value = ""; render("");
    const last = ALL[ALL.length - 1]; const el = last && document.getElementById("c" + last[0]);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  });
  fetch("../data/reels.json", { cache: "no-store" }).then(r => r.json()).then(reels => {
    const chapters = new Map();
    for (const x of reels.sort((a, b) => a.n - b.n || a.part - b.part)) {
      if (!chapters.has(x.n)) chapters.set(x.n, { title: x.title, parts: [] });
      chapters.get(x.n).parts.push(x);
    }
    ALL = [...chapters];
    render(q.value);
    document.getElementById("note").textContent = `กดปุ่มตอนเพื่อเปิดรีลบน Facebook · ${reels.length} รีล จาก ${chapters.size} ตอน · รายการอัปเดตทุกวัน`;
  }).catch(() => { document.getElementById("list").innerHTML = '<li class="ch"><span class="t">โหลดรายการไม่สำเร็จ: ลองรีเฟรชหน้า</span></li>'; });
</script>
</body>
</html>
